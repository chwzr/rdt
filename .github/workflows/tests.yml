name: Unit Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: rdtjs/package-lock.json

    - name: Install dependencies
      run: |
        cd rdtjs
        npm ci

    - name: Run Unit tests
      run: |
        cd rdtjs
        npm test
